# Build the signed APKs and publish them as a GitHub release.
#
# Runs when a tag like v1.1 is pushed. The tag must match versionName in
# app/build.gradle.kts, so a release can never carry the wrong number.
#
# The signing key lives in repository secrets, never in the repository:
#   KEYSTORE_BASE64    the .jks file, as base64
#   KEYSTORE_PASSWORD  storePassword
#   KEY_ALIAS          keyAlias
#   KEY_PASSWORD       keyPassword
# It must be the key 1.0 was signed with, or Android refuses to install the
# new version over the old one.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      # gradle-daemon-jvm.properties asks for 25. Installing it here saves
      # Gradle downloading its own.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches versionName
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Run the unit tests
        run: ./gradlew testDebugUnitTest

      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Without the key the build still succeeds, unsigned, and an
          # unsigned APK does not install. Stop here instead.
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret $name is not set"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build the release APKs
        run: ./gradlew assembleRelease

      - name: Name the APKs
        run: |
          out=app/build/outputs/apk/release
          mkdir -p dist
          for abi in arm64-v8a x86_64; do
            # An unsigned build is named ...-release-unsigned.apk, so a
            # missing file here also means the signing did not happen.
            mv "$out/app-$abi-release.apk" "dist/ytdlp-mobile-$VERSION-$abi.apk"
          done
          ls -l dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/VERSION/$VERSION/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          # A release made by hand on GitHub creates the tag and lands here
          # too. Then the APKs are added to it rather than failing.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk \
              --title "YTDLP Mobile $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --verify-tag
          fi

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties
